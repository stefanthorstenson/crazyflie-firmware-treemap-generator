<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Firmware Treemap</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f5f1;
    --panel: #ffffff;
    --text: #1c1a17;
    --text-dim: #6b6459;
    --border: #ddd7cc;
    --accent: #b5652e;
    --stroke: #f7f5f1;

    /* categorical (a_only / b_only / shared_shadowed) validated all-pairs
       CVD-safe via the dataviz skill's palette; shared_identical is
       deliberately a recessive neutral, not a fourth competing hue, since
       it's the "nothing to see here" majority case. */
    --c-a-only: #2a78d6;
    --c-b-only: #1baf7a;
    --c-shadowed: #eb6834;
    --c-identical: #b0a89c;

    /* single-build mode: per-component palette, ported from prototype.html.
       Not overridden in dark mode there either, so left as-is here too. */
    --c-deck: #c96a4d;
    --c-drivers: #d69a4a;
    --c-hal: #c9b23f;
    --c-init: #8fae4f;
    --c-lib: #4fae83;
    --c-modules: #4a9bab;
    --c-platform: #5c7fc4;
    --c-utils: #8e6fc4;
    --c-vendor: #b0a89c;
    --c-scripts: #a3785a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1a1815;
      --panel: #23201c;
      --text: #f1ede6;
      --text-dim: #a89e8f;
      --border: #3a352e;
      --accent: #e0895a;
      --stroke: #1a1815;

      --c-a-only: #3987e5;
      --c-b-only: #199e70;
      --c-shadowed: #d95926;
      --c-identical: #6b6459;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1a1815;
    --panel: #23201c;
    --text: #f1ede6;
    --text-dim: #a89e8f;
    --border: #3a352e;
    --accent: #e0895a;
    --stroke: #1a1815;

    --c-a-only: #3987e5;
    --c-b-only: #199e70;
    --c-shadowed: #d95926;
    --c-identical: #6b6459;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    padding: 20px 16px 40px;
    max-width: 1080px;
    margin: 0 auto;
  }
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  h1 {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 2px;
    letter-spacing: -0.01em;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 13px;
    margin: 0 0 18px;
  }
  .subtitle code {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 12px;
  }

  .toolbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .crumbs {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12.5px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .crumbs .seg {
    cursor: pointer;
    padding: 2px 5px;
    border-radius: 4px;
  }
  .crumbs .seg:hover { background: var(--panel); color: var(--text); }
  .crumbs .seg.current { color: var(--text); font-weight: 500; cursor: default; }
  .crumbs .seg.current:hover { background: none; }
  .crumbs .sep { color: var(--border); }

  .stats {
    font-size: 12px;
    color: var(--text-dim);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }

  #chart-wrap {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    overflow: hidden;
  }
  #chart { display: block; width: 100%; height: auto; }

  rect.tile {
    stroke: var(--stroke);
    stroke-width: 1.5px;
    cursor: pointer;
    transition: opacity 0.12s;
  }
  rect.tile:hover { opacity: 0.82; }
  rect.leaf { cursor: default; }
  rect.leaf:hover { opacity: 1; }
  rect.tile.l1-frame {
    stroke: #000;
    stroke-width: 3px;
  }
  rect.tile.dimmed { opacity: 0.12 !important; }

  text.label {
    fill: rgba(0,0,0,0.82);
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 500;
    pointer-events: none;
  }
  text.watermark {
    fill: #000;
    fill-opacity: 0.6;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    pointer-events: none;
    text-anchor: start;
    dominant-baseline: auto;
  }

  .tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--text);
    color: var(--bg);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    padding: 6px 9px;
    border-radius: 6px;
    max-width: 380px;
    line-height: 1.45;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.08s;
  }
  .tooltip .p { opacity: 0.7; word-break: break-all; }
  .tooltip .hdr { margin-top: 4px; padding-top: 4px; border-top: 1px solid rgba(255,255,255,0.25); }
  .tooltip .hdr-name { font-weight: 600; }
  .tooltip .hdr-path { opacity: 0.7; word-break: break-all; font-size: 11px; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    margin-top: 14px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .legend .item {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 5px;
    user-select: none;
  }
  .legend .item:hover { background: var(--panel); }
  .legend .item.inactive { opacity: 0.4; }
  .legend .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend .hint { font-size: 11px; opacity: 0.6; }

  .note {
    margin-top: 18px;
    padding: 10px 13px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .note b { color: var(--text); font-weight: 600; }

  .loader {
    margin-top: 18px;
    padding: 10px 13px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .loader button {
    font: inherit;
    font-size: 12.5px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .loader.hidden { display: none; }
</style>
</head>
<body>

<h1 id="page-title">crazyflie-firmware — build comparison treemap</h1>
<p class="subtitle" id="subtitle">Loading…</p>

<div class="toolbar">
  <div class="crumbs" id="crumbs"></div>
  <div class="stats" id="stats"></div>
</div>

<div id="chart-wrap">
  <svg id="chart"></svg>
</div>

<div class="legend" id="legend"></div>

<div class="note" id="note"></div>

<div class="loader" id="loader">
  <div>Couldn't load <code>data.json</code> automatically (this can happen when the page is
  opened directly as a <code>file://</code> URL — browsers block that fetch). Either run
  <code>python3 -m http.server</code> in this folder and open it over <code>http://</code>,
  or pick the file here:</div>
  <p><input type="file" id="file-input" accept="application/json"></p>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
(function () {
  const titleEl = document.getElementById("page-title");
  const subtitleEl = document.getElementById("subtitle");
  const noteEl = document.getElementById("note");
  const loaderEl = document.getElementById("loader");
  const fileInput = document.getElementById("file-input");
  const svg = d3.select("#chart");
  const wrap = document.getElementById("chart-wrap");
  const tooltip = document.getElementById("tooltip");
  const crumbsEl = document.getElementById("crumbs");
  const statsEl = document.getElementById("stats");
  const legendEl = document.getElementById("legend");

  const CATEGORY_ORDER = ["a_only", "b_only", "shared_shadowed", "shared_identical"];
  const CATEGORY_VAR = {
    a_only: "--c-a-only",
    b_only: "--c-b-only",
    shared_shadowed: "--c-shadowed",
    shared_identical: "--c-identical",
  };

  // single-build mode: same top-level palette as prototype.html
  const COMPONENT_VAR = {
    deck: "--c-deck", drivers: "--c-drivers", hal: "--c-hal", init: "--c-init",
    lib: "--c-lib", modules: "--c-modules", platform: "--c-platform",
    utils: "--c-utils", vendor: "--c-vendor", scripts: "--c-scripts",
  };
  function componentColor(name) {
    const varName = COMPONENT_VAR[name];
    return varName ? (getComputedStyle(document.documentElement).getPropertyValue(varName).trim() || "#999") : "#999";
  }

  // Flatten the single "src" wrapper so the top level shows the real
  // components (deck, drivers, hal, ...) alongside vendor/scripts, not one
  // dominating "src" tile -- same grouping the prototype validated, and it
  // also makes the diff view's watermark/l1-frame identify an actual
  // component rather than just "src".
  function flattenSrc(root) {
    if (!root.children) return root;
    const srcIdx = root.children.findIndex(c => c.name === "src");
    if (srcIdx === -1) return root;
    const src = root.children[srcIdx];
    const rest = root.children.filter((_, i) => i !== srcIdx);
    return { name: root.name, children: [...(src.children || []), ...rest] };
  }

  let data = null;
  let displayRoot = null;
  let mode = "diff"; // "diff" or "single"
  let buildA = "A", buildB = "B";
  let topNames = [];   // single mode: top-level component names
  let topColor = {};   // single mode: name -> color
  let stack = [];
  let activeCategory = null; // non-null => legend isolate mode (diff mode only)

  function categoryLabel(cat) {
    if (cat === "a_only") return `${buildA} only`;
    if (cat === "b_only") return `${buildB} only`;
    if (cat === "shared_shadowed") return "shared, shadowed";
    if (cat === "shared_identical") return "shared, identical";
    return cat;
  }

  function categoryColor(cat) {
    const varName = CATEGORY_VAR[cat] || CATEGORY_VAR.shared_identical;
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim() || "#999";
  }

  function countLeaves(n) {
    if (!n.children) return 1;
    return n.children.reduce((s, c) => s + countLeaves(c), 0);
  }
  function totalLines(n) {
    if (!n.children) return n.value;
    return n.children.reduce((s, c) => s + totalLines(c), 0);
  }
  function countByCategory(n, counts) {
    if (!n.children) {
      counts[visualCategory(n)] = (counts[visualCategory(n)] || 0) + 1;
      return counts;
    }
    n.children.forEach(c => countByCategory(c, counts));
    return counts;
  }

  // A header path outside the repo (an absolute path, e.g. a toolchain/libc
  // header under /usr/...) differs between cf2 (ARM cross-compile) and sim
  // (host x86-64 build) for almost every shared file, regardless of this
  // project's own include-path-shadowing mechanism -- that's a build-target
  // artifact, not something worth drawing the eye to. 02_make_treemap_data.py
  // deliberately keeps it in shadowed_headers (the data stays the full
  // truth); the chart collapses a shadow down to "shared, identical" when
  // none of its differing headers are project-relative, and always drops
  // the toolchain-only entries from what it lists in the tooltip.
  function isProjectHeader(path) {
    return !path.startsWith("/");
  }
  function meaningfulShadowedHeaders(leaf) {
    return (leaf.shadowed_headers || []).filter(
      h => h.a.some(isProjectHeader) || h.b.some(isProjectHeader)
    );
  }
  function visualCategory(leaf) {
    if (leaf.category === "shared_shadowed" && meaningfulShadowedHeaders(leaf).length === 0) {
      return "shared_identical";
    }
    return leaf.category;
  }

  function init(tree) {
    data = tree;
    mode = (tree.meta && tree.meta.mode) === "single" ? "single" : "diff";
    displayRoot = flattenSrc(data);

    if (mode === "single") {
      const buildName = (tree.meta && tree.meta.build) || "build";
      topNames = (displayRoot.children || []).map(c => c.name);
      topColor = {};
      topNames.forEach(n => topColor[n] = componentColor(n));

      titleEl.textContent = "crazyflie-firmware — component treemap";
      subtitleEl.innerHTML = `One build only (<code>${escapeHtml(buildName)}</code>), sized by
        line count. Colors show which top-level component each file belongs to.`;
      noteEl.innerHTML = `<b>What this shows:</b> <code>${escapeHtml(buildName)}</code>'s source
        tree, grouped by directory, tile area = line count. Click a directory tile to drill in,
        click a breadcrumb segment to go back up. Leaf files don't drill further. Colors
        represent components only (not a comparison against another build).`;
    } else {
      buildA = (tree.meta && tree.meta.build_a) || "A";
      buildB = (tree.meta && tree.meta.build_b) || "B";

      titleEl.textContent = "crazyflie-firmware — build comparison treemap";
      subtitleEl.innerHTML = `Comparing <code>${escapeHtml(buildA)}</code> vs.
        <code>${escapeHtml(buildB)}</code>, sized by line count. Colors show which build each
        file compiles into; component identity lives in the breadcrumb/watermark/tooltip path
        instead.`;
      noteEl.innerHTML = `<b>What this shows:</b> every source file compiled into either build,
        grouped by directory, tile area = line count. Click a directory tile to drill in, click a
        breadcrumb segment to go back up. Leaf files don't drill further. Color = ${escapeHtml(buildA)}-only /
        ${escapeHtml(buildB)}-only / shared-and-identical / shared-but-shadowed (a header that
        resolves to a different file per build). Click a legend entry to isolate a category;
        click it again to restore.`;
    }

    stack = [displayRoot];
    render();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function render() {
    const current = stack[stack.length - 1];
    const width = wrap.clientWidth - 20;
    const height = Math.max(420, Math.min(640, width * 0.55));

    svg.attr("viewBox", `0 0 ${width} ${height}`).attr("width", width).attr("height", height);
    svg.selectAll("*").remove();

    const hierarchy = d3.hierarchy(current)
      .sum(d => d.children ? 0 : d.value)
      .sort((a, b) => b.value - a.value);

    d3.treemap().size([width, height]).paddingInner(2).paddingOuter(3).round(true)(hierarchy);

    const g = svg.append("g");
    const all = hierarchy.descendants().filter(d => d.depth > 0);

    // single mode: once drilled below the root, every node in view shares
    // the color of the top-level ancestor (stack[1]), not whatever its own
    // depth-1 name is within the current subtree (ported from prototype.html).
    const topLevelName = stack.length > 1 ? stack[1].name : null;
    const depth1OfNode = new Map();
    if (mode === "single" && !topLevelName) {
      (hierarchy.children || []).forEach(child => {
        child.each(n => depth1OfNode.set(n, child.data.name));
      });
    }

    const rects = g.selectAll("g.node")
      .data(all)
      .join("g")
      .attr("class", "node");

    rects.append("rect")
      .attr("class", d => {
        let cls = "tile" + (d.children ? "" : " leaf") + (d.depth === 1 && d.children ? " l1-frame" : "");
        if (mode === "diff" && activeCategory && !d.children && visualCategory(d.data) !== activeCategory) cls += " dimmed";
        return cls;
      })
      .attr("x", d => d.x0)
      .attr("y", d => d.y0)
      .attr("width", d => Math.max(0, d.x1 - d.x0))
      .attr("height", d => Math.max(0, d.y1 - d.y0))
      .attr("fill", d => {
        if (mode === "single") {
          const groupName = topLevelName || depth1OfNode.get(d) || d.data.name;
          const base = topColor[groupName] || "#999";
          if (!d.children) return d3.color(base).brighter(0.35 * (d.depth - 1)).formatHex();
          return d3.color(base).darker(0.15 * (d.depth - 1)).formatHex();
        }
        if (!d.children) return categoryColor(visualCategory(d.data));
        // group frame: tint toward the dominant category among its leaves
        const counts = countByCategory(d.data, {});
        let dominant = "shared_identical", best = -1;
        for (const [cat, n] of Object.entries(counts)) if (n > best) { best = n; dominant = cat; }
        const base = categoryColor(dominant);
        return d3.color(base).darker(0.15 * (d.depth - 1)).formatHex();
      })
      .attr("fill-opacity", d => mode === "single" ? (d.children ? 0.55 : 0.92) : (d.children ? 0.35 : 0.92))
      .on("mousemove", (event, d) => {
        const relPath = d.ancestors().slice(0, -1).reverse().map(a => a.data.name).join("/");
        const lines = d.children ? totalLines(d.data) : d.data.value;
        let html = `<div>${escapeHtml(d.data.name)}</div><div class="p">${escapeHtml(relPath || "/")}</div>`;
        html += `<div>${lines.toLocaleString()} lines${d.children ? " · " + countLeaves(d.data) + " files" : ""}</div>`;
        if (mode === "diff" && !d.children) {
          html += `<div>${escapeHtml(categoryLabel(visualCategory(d.data)))}</div>`;
          const headers = meaningfulShadowedHeaders(d.data);
          if (headers.length) {
            html += headers.map(h => `<div class="hdr"><div class="hdr-name">${escapeHtml(h.name)}</div>` +
              `<div class="hdr-path">${escapeHtml(buildA)}: ${escapeHtml(h.a.join(", "))}</div>` +
              `<div class="hdr-path">${escapeHtml(buildB)}: ${escapeHtml(h.b.join(", "))}</div></div>`).join("");
          }
        }
        tooltip.innerHTML = html;
        tooltip.style.left = (event.clientX + 14) + "px";
        tooltip.style.top = (event.clientY + 14) + "px";
        tooltip.style.opacity = 1;
      })
      .on("mouseleave", () => { tooltip.style.opacity = 0; })
      .on("click", (event, d) => {
        const target = d.depth === 0 ? null : d.ancestors().find(a => a.depth === 1);
        if (target && target.children) {
          let node = target.data;
          stack.push(node);
          while (node.children.length === 1 && node.children[0].children) {
            node = node.children[0];
            stack.push(node);
          }
          render();
        }
      });

    // top-level watermark carries component identity now that color is
    // repurposed for build/shared category.
    const defs = svg.append("defs");
    const watermarkLayer = svg.append("g").attr("class", "watermark-layer");
    rects.filter(d => d.depth === 1 && d.children).each(function (d, i) {
      const w = d.x1 - d.x0, h = d.y1 - d.y0;
      if (w < 24 || h < 24) return;
      const clipId = `l1-clip-${i}`;
      defs.append("clipPath")
        .attr("id", clipId)
        .append("rect")
        .attr("x", d.x0).attr("y", d.y0).attr("width", w).attr("height", h);
      const fontSize = Math.max(11, Math.min(w / (d.data.name.length * 0.8 || 1), h * 0.55, 96));
      const pad = Math.max(4, fontSize * 0.15);
      watermarkLayer.append("text")
        .attr("class", "watermark")
        .attr("clip-path", `url(#${clipId})`)
        .attr("x", d.x0 + pad)
        .attr("y", d.y1 - pad)
        .attr("font-size", fontSize)
        .text(d.data.name);
    });

    rects.filter(d => !d.children)
      .append("text")
      .attr("class", "label")
      .attr("x", d => d.x0 + 4)
      .attr("y", d => d.y0 + 13)
      .attr("font-size", 10)
      .text(d => {
        const w = d.x1 - d.x0, h = d.y1 - d.y0;
        if (w < 46 || h < 16) return "";
        return d.data.name;
      });

    renderCrumbs();
    renderStats(current);
    renderLegend();
  }

  function renderCrumbs() {
    crumbsEl.innerHTML = "";
    stack.forEach((node, i) => {
      if (i > 0) {
        const sep = document.createElement("span");
        sep.className = "sep";
        sep.textContent = "/";
        crumbsEl.appendChild(sep);
      }
      const seg = document.createElement("span");
      seg.className = "seg" + (i === stack.length - 1 ? " current" : "");
      seg.textContent = node.name;
      seg.onclick = () => {
        if (i !== stack.length - 1) {
          stack = stack.slice(0, i + 1);
          render();
        }
      };
      crumbsEl.appendChild(seg);
    });
  }

  function renderStats(current) {
    const files = countLeaves(current);
    const lines = totalLines(current);
    statsEl.textContent = `${files.toLocaleString()} files · ${lines.toLocaleString()} lines`;
  }

  function renderLegend() {
    legendEl.innerHTML = "";

    if (mode === "single") {
      // static, display-only -- matches prototype.html (no isolate mode)
      topNames.forEach(name => {
        const item = document.createElement("div");
        item.className = "item";
        const sw = document.createElement("div");
        sw.className = "swatch";
        sw.style.background = topColor[name];
        item.appendChild(sw);
        const label = document.createElement("span");
        label.textContent = name;
        item.appendChild(label);
        legendEl.appendChild(item);
      });
      return;
    }

    CATEGORY_ORDER.forEach(cat => {
      const item = document.createElement("div");
      item.className = "item" + (activeCategory && activeCategory !== cat ? " inactive" : "");
      const sw = document.createElement("div");
      sw.className = "swatch";
      sw.style.background = categoryColor(cat);
      item.appendChild(sw);
      const label = document.createElement("span");
      label.textContent = categoryLabel(cat);
      item.appendChild(label);
      item.onclick = () => {
        activeCategory = activeCategory === cat ? null : cat;
        render();
      };
      legendEl.appendChild(item);
    });
    const hint = document.createElement("span");
    hint.className = "hint";
    hint.textContent = activeCategory ? "(click again to show all)" : "(click a category to isolate it)";
    legendEl.appendChild(hint);
  }

  window.addEventListener("resize", () => { if (data) render(); });

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file) return;
    file.text().then(text => {
      try {
        init(JSON.parse(text));
        loaderEl.classList.add("hidden");
      } catch (e) {
        alert("That doesn't look like valid treemap JSON: " + e.message);
      }
    });
  });

  const params = new URLSearchParams(location.search);
  const dataUrl = params.get("data") || "data.json";
  fetch(dataUrl)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(tree => { init(tree); loaderEl.classList.add("hidden"); })
    .catch(() => {
      subtitleEl.textContent = "No data loaded yet.";
      loaderEl.classList.remove("hidden");
    });
})();
</script>
</body>
</html>
